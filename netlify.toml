# Static dashboard + one proxy function. Secrets (CUSTOMER_API_KEY etc.) live in Netlify
# environment variables, never in this repo.

[build]
  publish = "public"
  functions = "netlify/functions"

# Deploy-to-Netlify template config: when a site is created from the deploy button,
# Netlify prompts the deployer for these values and sets them as the site's environment
# variables. This is what makes the repo reusable per customer with no code changes.
[template.environment]
  USAGE_API_URL = "Base URL of your Netlify Usage API deployment (https://....netlify.app)"
  CUSTOMER_API_KEY = "The API key (bearer token) you were issued for the usage API"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    # The page needs inline styles/scripts (single-file dashboard), Chart.js from jsDelivr,
    # Google Fonts, and fetch() to its own /api/* proxy. Everything else stays blocked.
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
